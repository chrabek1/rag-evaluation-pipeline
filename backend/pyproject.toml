[project]
name = "app"
version = "0.1.0"
description = "Backend service for RAG retrieval and evaluation using PostgreSQL with pgvector"
authors = [
    { name = "chrabek1", email = "radekulig@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""