services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-eval-postgres
    environment:
      POSTGRES_DB: rag_eval
      POSTGRES_USER: rag_eval
      POSTGRES_PASSWORD: rag_eval
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_eval -d rag_eval"]
      interval: 5s
      timeout: 5s
      retries: 5

  embedding_service:
    build:
      context: ./embedding_service
    env_file:
      - .env
    volumes:
      - ./embedding_service:/app
    container_name: rag-eval-embedding-service
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/docs')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./dane.csv:/data/dane.csv:ro
    container_name: rag-eval-backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      embedding_service:
        condition: service_healthy

volumes:
  postgres_data: